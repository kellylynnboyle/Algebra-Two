<script>
window.QUIZ_TITLE = "Complex Numbers & Rational Exponents Quiz";
window.QUIZ_DATA = [
  {
    question: "Simplify: i^58",
    choices: [
      "-1",
      "i",
      "-i",
      "1"
    ],
    correctIndex: 0,
    explanation: "58 ÷ 4 = 14 remainder 2, and remainder 2 in the cycle i, -1, -i, 1 lands on -1. Choice B mismatches remainder 2 with the value for remainder 1 instead."
  },
  {
    question: "Add: (4 + 3i) + (2 - 5i)",
    choices: [
      "6 - 2i",
      "6 + 2i",
      "2 + 8i",
      "8 - 2i"
    ],
    correctIndex: 0,
    explanation: "Combine real parts (4 + 2 = 6) and imaginary parts (3 + -5 = -2) separately to get 6 - 2i. Choice C is what you'd get if you subtracted the numbers instead of adding them."
  },
  {
    question: "Simplify: (4 + 5i) - (-1 + 2i)",
    choices: [
      "5 + 3i",
      "3 + 3i",
      "5 + 7i",
      "3 + 7i"
    ],
    correctIndex: 0,
    explanation: "Distribute the minus sign across both terms first: 4 + 5i + 1 - 2i = 5 + 3i. Choice B is the classic sign-error trap — leaving the double negative -(-1) unflipped instead of turning it into +1."
  },
  {
    question: "Multiply: (1 + 2i)(3 + 4i)",
    choices: [
      "-5 + 10i",
      "3 + 10i + 8i^2",
      "11 + 10i",
      "-5 + 2i"
    ],
    correctIndex: 0,
    explanation: "FOILing gives 3 + 4i + 6i + 8i^2 = 3 + 10i + 8i^2, and substituting i^2 = -1 gives 3 + 10i - 8 = -5 + 10i. Choice B is the trap of stopping before substituting i^2 = -1 at the end."
  },
  {
    question: "Multiply (5 - 3i) by its complex conjugate.",
    choices: [
      "34",
      "16",
      "25 - 9i",
      "16 - 30i"
    ],
    correctIndex: 0,
    explanation: "The conjugate of 5 - 3i is 5 + 3i, and (5-3i)(5+3i) = 5^2 - (3i)^2 = 25 - 9i^2 = 25 + 9 = 34. Choice B comes from treating -9i^2 as just -9 (i.e. using i^2 = 1 instead of -1)."
  },
  {
    question: "Divide: (5 + i) / (2 - 3i)",
    choices: [
      "7/13 + 17/13 i",
      "1 + 17/13 i",
      "5/2 - 1/3 i",
      "7/13 - 17/13 i"
    ],
    correctIndex: 0,
    explanation: "Multiply top and bottom by the conjugate 2 + 3i: numerator (5+i)(2+3i) = 10 + 17i + 3i^2 = 7 + 17i, denominator (2-3i)(2+3i) = 4 + 9 = 13, giving 7/13 + 17/13 i. Choice C is the trap of dividing real and imaginary parts directly instead of multiplying by the conjugate first."
  },
  {
    question: "Simplify: √(-50)",
    choices: [
      "5i√2",
      "i√50",
      "25i√2",
      "5i√10"
    ],
    correctIndex: 0,
    explanation: "√(-50) = i√50 = i√(25·2) = 5i√2. Choice B pulls out i correctly but stops before simplifying the radical, since 50 has a perfect-square factor of 25."
  },
  {
    question: "Solve using the quadratic formula: x^2 + 6x + 13 = 0",
    choices: [
      "x = -3 ± 2i",
      "x = -3 ± 4i",
      "x = 3 ± 2i",
      "x = -6 ± 2i"
    ],
    correctIndex: 0,
    explanation: "a=1, b=6, c=13, so the discriminant is 36 - 52 = -16, and x = (-6 ± √-16)/2 = (-6 ± 4i)/2 = -3 ± 2i. Choice B forgets to divide the imaginary part by 2a, dividing only the real part."
  },
  {
    question: "Write ⁴√(x^3) using a rational exponent.",
    choices: [
      "x^(3/4)",
      "x^(4/3)",
      "x^12",
      "x^(1/12)"
    ],
    correctIndex: 0,
    explanation: "The index (4) becomes the denominator and the power (3) becomes the numerator: x^(3/4). Choice B is the classic trap of flipping which number is the root index and which is the power."
  },
  {
    question: "Simplify: (x^(1/2) * x^(1/4)) / x^(1/8)",
    choices: [
      "x^(5/8)",
      "x^(3/4)",
      "x^(7/8)",
      "x^(1/8)"
    ],
    correctIndex: 0,
    explanation: "Use the product rule on the top and the quotient rule with the bottom: 1/2 + 1/4 - 1/8 = 4/8 + 2/8 - 1/8 = 5/8. Choice C comes from adding all three exponents instead of subtracting the last one."
  }
];
